{% extends "employee_portal/templates/base.html" %}
{% block style %}
<link rel="stylesheet" href="/assets/employee_portal/css/my_profile.css">
<link rel="stylesheet" href="/assets/employee_portal/css/base.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
{% endblock %}
{% block title %}{{ ("Mis Datos") }}{% endblock %}
{% block page_content %} 
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h2>
              Mis Datos
              <i class="fas fa-edit edit-icon"></i>
            </h2>
            <form id="employee-form" method="post">
              <input type="hidden" id="employee-name" value="{{ employee.name }}">
              <input type="hidden" id="csrf_token" value="{{csrf_token}}">
              <div class="frappe-card">
                <h3>Información Personal</h3>
                <div class="row">
                  <div class="col-md-6">
                    <div class="frappe-control">
                      <label for="first_name">Primer Nombre</label>
                      <input type="text" name="first_name" id="first_name" class="form-control" value="{{employee.first_name}}">
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="frappe-control">
                      <label for="email">Segundo Nombre</label>
                      <input type="text" name="middle_name" id="middle_name" class="form-control" value="{{employee.middle_name}}">
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="frappe-control">
                      <label for="last_name">Apellido</label>
                      <input type="text" name="last_name" id="last_name" class="form-control" value="{{employee.last_name}}">
                    </div>        
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="frappe-control">
                      <label for="dob">Fecha de Nacimiento</label>
                      <input type="date" name="dob" id="dob" class="form-control" value="{{employee.date_of_birth}}">
                    </div>  
                  </div>
                  <div class="col-md-6">
                    <div class="frappe-control">
                      <label for="gender">Género</label>
                      <select name="gender" id="gender" class="form-control">
                        {% for gender in genders%}
                          <option value="{{gender.gender}}" {% if employee.gender == gender.gender %}selected{% endif %}>{{gender.gender}}</option>
                        {% endfor %}
                      </select>
                    </div>
                  </div>
                </div>
              </div>
              <div class="frappe-card">
                <h3>Información de Contacto</h3>
                <div class="row">
                  <div class="col-md-6">
                    <div class="frappe-control">
                      <label for="employee-number">Número Telefónico</label>
                      <input type="tel" name="employee-number" id="employee-number" class="form-control" value="{{employee.employee_number}}">
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="frappe-control">
                      <label for="emergency-phone">Teléfono de Emergencia</label>
                      <input type="tel" name="emergency-phone" id="emergency-phone" class="form-control" value="{{employee.emergency_phone_number}}">
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="frappe-control">
                      <label for="emergency-contact">Contacto de Emergencia</label>
                        <input type="text" name="emergency-contact" id="emergency-contact" class="form-control" value="{{employee.person_to_be_contacted}}">
                    </div>
                  </div>
                </div>
              </div>
              <div class="frappe-card">
                <h3>Detalles del Empleo</h3>
                <div class="row">
                  <div class="col-md-6">
                    <div class="frappe-control">
                      <label for="company">Compañía</label>
                      <input type="text" name="company" id="company" class="form-control" value="{{employee.company}}" readonly>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="frappe-control">
                      <label for="employement-type">Tipo de Empleo</label>
                      <input type="text" name="employment-type" id="employment-type" class="form-control" value="{{employee.employment_type}}" readonly>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="frappe-control">
                      <label for="department">Departamento</label>
                      <input type="text" name="department" id="department" class="form-control" value="{{employee.department}}" readonly>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="frappe-control">
                      <label for="designation">Puesto</label>
                      <input type="text" name="designation" id="designation" class="form-control" value="{{employee.designation}}" readonly>
                    </div>
                  </div>
                </div>
                <div class="row">
                  <div class="col-md-6">
                    <div class="frappe-control">
                      <label for="date-of-joining">Fecha de Ingreso</label>
                      <input type="date" name="date-of-joining" id="date-of-joining" class="form-control" value="{{employee.date_of_joining}}" readonly> 
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="frappe-control">
                      <label for="date-of-leaving">Fecha de Terminación de Contrato</label>
                      <input type="date" name="date-of-leaving" id="date-of-leaving" class="form-control" value="{{employee.contract_end_date}}" readonly>
                    </div>
                  </div>
                </div>
              </div>
              <div class="row">
                <div class="col-md-12 text-right"> 
                    <input type="submit" value="Guardar" class="btn btn-primary">
                </div>
              </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
{% block script %}
<script src="/assets/employee_portal/js/my_profile.js"></script>  
{% endblock %}
