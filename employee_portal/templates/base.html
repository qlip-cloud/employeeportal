{% extends "frappe/templates/base.html" %}
{% block style %}
<link rel="stylesheet" href="/assets/employee_portal/css/base.css">
{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-md-3">
            <div class="side-bar d-flex flex-column align-items-center justify-content-center" style="position: sticky; top: 10%; height: 90vh;">
                {% for module in modules %}
                <div class="card my-3 active-card" style="width: 100%;">
                    <div class="card-body">
                        <a href="{{module.url}}" class="module-link" data-url="{{module.url}}" style="text-decoration: none; color: inherit;">
                            <i class="fa {{ module.icon }} fa-3x mb-2"></i>
                            <h5 class="card-title">{{ module.name }}</h5>
                        </a>                        
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
        <div class="col-md-9">
            <div id="dynamic-content">
                {% block page_content %}
                {% endblock %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block script %}
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
<script>
    $(document).ready(function() {
        $('.module-link').on('click', function(event) {
            event.preventDefault(); 
            let url = $(this).data('url'); 
            $('#dynamic-content').html('<div class="loading-message">Cargando...</div>');
            $.ajax({
                url: url,
                method: 'GET',
                success: function(response) {
                    $('#dynamic-content').html($(response).find('#dynamic-content').html());
                    history.pushState(null, '', url); 
                },
                error: function() {
                    console.error("Error al cargar el contenido.");
                }
            });
        });
    });
</script>
{% endblock %}
